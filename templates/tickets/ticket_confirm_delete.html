{% extends "base.html" %}

{% block title %}
Удаление заявки
{% endblock %}

{% block content %}

<div class="mb-4">
    <a href="{% url 'ticket_detail' object.pk %}" class="text-decoration-none">
        ← Назад к заявке
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">

                <h1 class="h3 mb-3 text-danger">
                    Удаление заявки
                </h1>

                <p class="mb-4">
                    Вы действительно хотите удалить заявку
                    <strong>№{{ object.id }} — {{ object.title }}</strong>?
                </p>

                <div class="alert alert-warning">
                    Это действие нельзя отменить.
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            Удалить заявку
                        </button>

                        <a href="{% url 'ticket_detail' object.pk %}"
                           class="btn btn-outline-secondary">
                            Отмена
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
